<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAVIO — Precyzja w konstrukcji</title>
<meta name="description" content="TRAVIO Sp. z o.o. — projektowanie i konstrukcje. Wodzisław Śląski." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1d2a4d;
    --navy-deep: #141d36;
    --orange: #d97842;
    --paper: #f4f1ea;
    --line: rgba(29, 42, 77, 0.18);
    --text: #1d2a4d;
    --muted: #5a6480;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--paper);
    overflow-x: hidden;
  }

  /* Subtelne tło z motywem rysunku technicznego */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(217, 120, 66, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(29, 42, 77, 0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  /* Strzałki nawigacji - większe */
  .nav-btn {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1.5px solid var(--navy);
    background: var(--paper);
    color: var(--navy);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 5;
  }

  .nav-btn:hover {
    background: var(--navy);
    color: var(--paper);
    transform: scale(1.08);
  }

  .nav-btn:active { transform: scale(0.95); }

  .nav-btn svg { width: 28px; height: 28px; }

  /* Karta wizytówki – większa */
  .card-wrap {
    flex: 1;
    perspective: 2400px;
    max-width: 980px;
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 1.7 / 1;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 40px 80px -20px rgba(20, 29, 54, 0.35),
      0 24px 48px -18px rgba(20, 29, 54, 0.25);
  }

  /* FRONT - czyste białe tło */
  .face-front {
    background: #ffffff;
    padding: 50px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .front-top {
    display: flex;
    align-items: center;
    gap: 50px;
    position: relative;
    z-index: 2;
  }

  .logo-block {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    width: 280px;
    height: auto;
    display: block;
  }

  .people {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border-left: 2px solid rgba(29, 42, 77, 0.12);
    padding-left: 36px;
  }

  .person {
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0.3px;
  }

  .contact {
    margin-top: 18px;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.7;
    position: relative;
    z-index: 2;
  }

  .contact a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .contact a:hover { color: var(--orange); }

  .front-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 14px;
    color: var(--navy);
    line-height: 1.6;
    position: relative;
    z-index: 2;
    padding-top: 30px;
    border-top: 1px solid rgba(29, 42, 77, 0.08);
  }

  .company-info strong {
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 15px;
  }

  /* TYŁ */
  .face-back {
    background: var(--navy);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--paper);
    padding: 50px;
    overflow: hidden;
  }

  .face-back::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, transparent 49%, rgba(244, 241, 234, 0.06) 49%, rgba(244, 241, 234, 0.06) 51%, transparent 51%),
      linear-gradient(-45deg, transparent 49%, rgba(244, 241, 234, 0.06) 49%, rgba(244, 241, 234, 0.06) 51%, transparent 51%);
    background-size: 80px 80px;
  }

  .back-logo {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .back-logo .logo-img {
    width: 360px;
    /* Inwersja kolorów - logo na ciemnym tle */
    filter: brightness(0) invert(1);
  }

  .tagline {
    position: relative;
    z-index: 2;
    margin-top: 36px;
    font-size: 16px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(244, 241, 234, 0.85);
    font-weight: 500;
  }

  /* Wskaźnik strony */
  .indicator {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(29, 42, 77, 0.25);
    transition: all 0.3s ease;
  }

  .dot.active {
    background: var(--orange);
    width: 30px;
    border-radius: 5px;
  }

  /* RWD - tablet */
  @media (max-width: 1024px) {
    .stage { gap: 16px; }
    .face-front { padding: 40px 44px; }
    .front-top { gap: 32px; }
    .logo-img { width: 220px; }
    .person { font-size: 19px; }
    .contact { font-size: 15px; }
    .back-logo .logo-img { width: 280px; }
  }

  /* RWD - telefon */
  @media (max-width: 720px) {
    main { padding: 20px 8px; }
    .stage { gap: 6px; }
    .nav-btn { width: 44px; height: 44px; }
    .nav-btn svg { width: 18px; height: 18px; }
    .face-front { padding: 24px 22px; }
    .front-top {
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }
    .logo-img { width: 140px; }
    .people {
      border-left: none;
      border-top: 2px solid rgba(29, 42, 77, 0.12);
      padding-left: 0;
      padding-top: 16px;
      width: 100%;
      gap: 8px;
    }
    .person { font-size: 14px; }
    .contact { font-size: 12px; margin-top: 10px; }
    .front-bottom { font-size: 11px; padding-top: 16px; }
    .company-info strong { font-size: 12px; }
    .back-logo .logo-img { width: 180px; }
    .tagline { font-size: 11px; letter-spacing: 3px; margin-top: 22px; }
  }

  /* Animacja wejścia */
  .card-wrap {
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .nav-btn {
    animation: fadeIn 1.2s ease 0.3s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <main>
    <div class="stage">
      <button class="nav-btn" id="prevBtn" aria-label="Poprzednia strona">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="card-wrap">
        <div class="card" id="card">
          <!-- FRONT -->
          <div class="face face-front">
            <div class="front-top">
              <div class="logo-block">
                <img src="logo.png" alt="TRAVIO" class="logo-img" />
              </div>

              <div class="people">
                <div class="person">Bartosz Lerch</div>
                <div class="person">Jakub Loman</div>
                <div class="person">Kamil Foksowicz</div>
                <div class="contact">
                  <a href="tel:+48731177085">+48 731 177 085</a><br>
                  <a href="mailto:biuro@traviopro.net">biuro@traviopro.net</a><br>
                  <a href="https://traviopro.net">traviopro.net</a>
                </div>
              </div>
            </div>

            <div class="front-bottom">
              <div class="company-info">
                <strong>TRAVIO SP. Z O.O.</strong><br>
                ul. Pszowska 26, 44-300 Wodzisław Śląski<br>
                NIP: 6472618006
              </div>
            </div>
          </div>

          <!-- TYŁ -->
          <div class="face face-back">
            <div class="back-logo">
              <img src="logo.png" alt="TRAVIO" class="logo-img" />
            </div>
            <div class="tagline">Precyzja w konstrukcji</div>
          </div>
        </div>

        <div class="indicator">
          <span class="dot active" id="dot1"></span>
          <span class="dot" id="dot2"></span>
        </div>
      </div>

      <button class="nav-btn" id="nextBtn" aria-label="Następna strona">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </main>

<script>
  const card = document.getElementById('card');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');

  function toggleCard() {
    card.classList.toggle('flipped');
    const isFlipped = card.classList.contains('flipped');
    dot1.classList.toggle('active', !isFlipped);
    dot2.classList.toggle('active', isFlipped);
  }

  prevBtn.addEventListener('click', toggleCard);
  nextBtn.addEventListener('click', toggleCard);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') toggleCard();
  });

  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) toggleCard();
  }, { passive: true });
</script>
</body>
</html>
